# The D1 method chosen in development. Hashed by the freeze record; any change after the freeze is a
# protocol change that must be logged in the preregistration.
#
# Chosen on the development split: M2 (wells calibrated from an early healthy window) over M1 (nominal
# wells) and baseline B1. Temperature chosen on the calibration split only, as the smallest of
# {2, 3, 4} that kept every preregistered coverage band; no other setting was tuned.
name: M2_calibrated_inversion
calibrate_wells: true
baseline_hours: 6.0          # assumes the first 6 hours are free of restriction (in every split, onset >= 12 h)
current_hours: 2.0
severity_step: 0.01
severity_max: 0.69
prior_none: 0.15
model_error: {PRESSURE: 0.0, DP: 0.0, FLOW: 0.0}
temperature: 3.0
support_mass: 0.999
support_cap: 120
shut_in_support_cap: 40
eig_draws: 48
seed: 20261112
