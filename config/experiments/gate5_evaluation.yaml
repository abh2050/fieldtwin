# Gate 5 evaluation rules. Committed before any model was fitted, and the holdout stays unread until
# development is finished. A later change to this file has to be disclosed in reports/gates/gate_5.md.
version: 3
seed: 50005

# Version 3, made after technical review and after both holdouts had been read, so the regenerated
# holdout results are not from an unread holdout. Three defects were corrected:
#  1. An event now ends at its last event-labeled row, as the matching rule states, and not at the last
#     scored row. No event in the current data is followed by normal rows, so no result depended on this.
#  2. The threshold search now covers the whole score range. Version 2 stopped at the median.
#  3. Logistic regression must converge, and its convergence is recorded with every fit.
#
# Version 2, made after development results and before either holdout was read. Version 1 had two flaws,
# both found by looking at development results:
#  1. Taking the lowest threshold within budget could choose an alarm that never turns off, because one
#     endless episode counts as one false alarm. Thresholds are now walked downward from the top, stopping
#     at the first violation, and time in alarm has its own limit.
#  2. A long event catches a false alarm by chance, which inflated event recall. Chance-level recall is now
#     reported for each result, and selection uses recall above chance.

methods:
  # In the order of complexity used to break ties. Earlier means simpler.
  - static_threshold
  - rolling_deviation
  - logistic_regression
  - isolation_forest
  - hist_gradient_boosting

alarm:
  # A false-alarm budget all methods share, so they are compared at one operating point.
  false_alarms_per_hour_budget: 0.05
  max_fraction_of_normal_time_in_alarm: 0.05
  # Candidate thresholds: this many quantiles log-spaced toward the top of the validation scores, plus
  # this many evenly spaced from the minimum to the maximum.
  threshold_grid_points: 60

support:
  # Below these, precision and recall are not reported for a group.
  min_events: 5
  min_clusters: 3
  min_clusters_for_interval: 5

uncertainty:
  bootstrap_resamples: 2000
  confidence: 0.95

selection:
  # Development data: pooled development folds for 3W, in-regime test cases for AETHER. Added after the
  # first commit of this file and before any fit, because the first version didn't name AETHER's.
  # 1. Keep methods at or under the budget on development data, using the point estimate.
  # 2. Find the highest event skill among them. Skill is event recall minus chance-level recall.
  # 3. Methods whose skill interval includes that value are tied, and the simplest tied method wins.
  rule: simplest_within_interval_of_best_event_skill

three_w:
  # Only recorded instances are evaluated. Simulated and hand-drawn ones appear in one training
  # sensitivity test, and never in any evaluation set.
  evaluate_origins: [REAL]
  window_s: 300
  stride_s: 60
  rolling_baseline_windows: 60
  rolling_gap_windows: 5
  persistence_windows: 3
  suppression_s: 1800
  max_train_windows_per_class: 40000
  splits:
    holdout_folds: 5  # One fold of wells is the holdout.
    development_folds: 4
    validation_folds: 4  # Within each training set, one fold of wells sets the threshold.
  features_excluded: [class, state, timestamp]
  # Readings outside these become missing in derived data, and raw files don't change. Added after the
  # first commit of this file and before any fit, on finding impossible values such as 1.7e38 degrees C.
  # The lower pressure limit is below -1 atm, which no absolute or gauge reference allows.
  plausibility:
    pressure_pa: [-150000.0, 200000000.0]
    temperature_c: [-60.0, 300.0]
    opening_percent: [-1.0, 101.0]
  # Every row inside the leading unlabeled part of a file is unscored, and it can only serve as input.

aether:
  evaluate_origins: [SYNTHETIC]
  window_samples: 12
  stride_samples: 1
  rolling_baseline_windows: 288
  rolling_gap_windows: 12
  persistence_windows: 3
  suppression_s: 21600
  max_train_windows_per_class: 40000

event_matching:
  # Applied identically to both tracks.
  episode: >
    An episode starts once the score is at or above the threshold for persistence_windows consecutive
    windows. It ends after the score stays below the threshold for suppression_s. Alerts inside one
    episode count once.
  detection: >
    An event is detected only if an episode starts inside the labeled event, between the first
    event-labeled row and the last labeled row.
  active_at_onset: >
    An episode that started earlier and is still active at onset isn't a detection. These are counted
    and reported separately.
  false_alarm: >
    An episode that starts on a row labeled normal is one false alarm, including when it continues into
    a later event.
  unscored: >
    Episodes starting on unlabeled rows, or in an instance excluded from the metric, count as nothing.
  operating_time: >
    Windows labeled normal multiplied by the stride, with each well and timestamp counted once, because
    3W instances can overlap in time.
  chance_level: >
    The recall expected from alarms unrelated to any event: 1 - exp(-rate * duration), averaged over
    events, using the method's measured false-alarm rate and each event's duration. It is an
    approximation that treats false alarms as a Poisson process.
  time_in_alarm: >
    Normal windows with an episode running, divided by all normal windows.
  sample_label: >
    A window takes the label of its last row. Positive means any event or transient label.
