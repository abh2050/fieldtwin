rules:
  - product_kind: G
    unit_id: MCF_15025PSIA_60F
    product_scope: Gas including CO2
    base_conditions: 15.025 psia and 60 degrees F
    verification_status: VERIFIED
    evidence:
      - {ref: ocd_dictionary, quote: "prd_knd_cde G = Gas; prod_amt = Volume of fluid produced (MCF or BBLS)"}
      - {ref: c115_2025, page: 17, quote: "Enter the MCF of gas produced (also include CO2) for the month. (Whole amounts, adjusted to 15.025 psia.)"}
      - {ref: c115_2019, quote: "MCF of gas (including CO2) produced for the month ... Adjustment to 15.025 psia."}
      - {ref: nmac_19_15_2, page: 3, quote: "computed at a base pressure of 10 ounces per square inch above the average barometric pressure of 14.4 psi (15.025 psi absolute), at a standard base temperature of 60 degrees fahrenheit"}
  - product_kind: O
    unit_id: BBL_60F
    product_scope: Crude oil or condensate
    base_conditions: 60 degrees F, atmospheric pressure at sea level
    verification_status: VERIFIED
    evidence:
      - {ref: ocd_dictionary, quote: "prd_knd_cde O = Oil; prod_amt = Volume of fluid produced (MCF or BBLS)"}
      - {ref: c115_2025, page: 17, quote: "Enter the number of barrels of crude oil or condensate produced for the month. (Whole amounts, no decimals.)"}
      - {ref: c115_2019, quote: "Barrels of crude oil or condensate produced for the month."}
      - {ref: nmac_19_15_2, quote: "\"Barrel\" means 42 United States gallons measured at 60 degrees fahrenheit and atmospheric pressure at the sea level"}
  - product_kind: W
    unit_id: BBL_60F
    product_scope: Produced water
    base_conditions: 60 degrees F, atmospheric pressure at sea level
    verification_status: VERIFIED
    evidence:
      - {ref: ocd_dictionary, quote: "prd_knd_cde W = Water; prod_amt = Volume of fluid produced (MCF or BBLS)"}
      - {ref: c115_2025, page: 17, quote: "Enter the number of barrels of water produced for the month. (Whole amounts, no decimals.)"}
      - {ref: c115_2019, quote: "Barrels of water produced for the month."}
      - {ref: nmac_19_15_2, quote: "\"Barrel\" means 42 United States gallons measured at 60 degrees fahrenheit and atmospheric pressure at the sea level"}

dates:
  production_date:
    fields: [prodn_yr, prodn_mth]
    status: VERIFIED
    meaning: Month and year in which production occurred (OCD dictionary).
  filing_deadline:
    status: VERIFIED
    meaning: 15th day of the second month following the month of production (C-115 2025, PDF page 4).
  eff_dte:
    status: UNRESOLVED
    meaning: >-
      The dictionary says only "The date which the RECORD is effective". Recent values look like
      processing times shortly after filing, and old values are month-ends. OCD does not define it as a
      filing date, so it is stored as source_effective_at and must not be used as a production or filing date.
  mod_dte:
    status: VERIFIED
    meaning: Last modified (OCD dictionary).

amendments:
  status: VERIFIED
  meaning: >-
    An amended report replaces the operator's earlier file for that month: it "will completely erase and take
    the place of the old file" (C-115 2025, PDF page 31). The extract therefore holds current values only.
    amend_ind records that a row came from an amended filing. Earlier values cannot be recovered from this source.

unresolved:
  - Whether a missing oil or water row means zero. It is kept as missing, not assumed zero.
  - An operator's compliance with the rules cannot be verified from this data. The rules establish what was required.
  - The state rule copy is amended through 8/23/2022. Later amendments, if any, were not checked.
  - Whether a given rule edition applied to each production month was not traced. The 2019 and 2025 instructions state the same units, and the window starts in 2023.
