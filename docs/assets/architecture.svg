<rect x="20" y="165" width="170" height="50" fill="#19332e" stroke="#5cc98b"/><text x="34" y="186">Carbon Mapper</text><text class="m" x="34" y="204">methane plumes</text>
<rect x="20" y="225" width="170" height="50" fill="#19332e" stroke="#5cc98b"/><text x="34" y="246">USDA NAIP</text><text class="m" x="34" y="264">aerial imagery</text>
<rect x="264" y="30" width="168" height="60" fill="#352c25" stroke="#f2a93b"/><text x="278" y="54">AETHER simulator</text><text class="m" x="278" y="72">coupled network solver</text>
