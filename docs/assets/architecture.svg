<svg xmlns="http://www.w3.org/2000/svg" width="1140" height="300" viewBox="0 0 1140 300" role="img" aria-labelledby="title description">
<title id="title">FieldTwin system architecture</title>
<desc id="description">Four public sources feed immutable acquisition batches and source-specific PostGIS tables. The AETHER simulator feeds separate synthetic tables. Detection, aerial proximity evidence, decision economics, and diagnosis read from the canonical store. FastAPI and React expose the results. Petrobras 3W remains a separate offshore benchmark.</desc>
