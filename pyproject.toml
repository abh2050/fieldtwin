[project]
name = "fieldtwin"
version = "0.1.0"
description = "Industrial decision-support platform demonstrated on AETHER Field, a fictional facility."
requires-python = ">=3.12,<3.13"
dependencies = [
  "alembic>=1.20.1",
  "duckdb>=1.1",
  "httpx>=0.27",
  "joblib>=1.4",
  "mapbox-vector-tile>=2.1",
  "mlflow-skinny>=2.16",
  "numpy>=2.5.4",
  "openpyxl>=3.1",
  "ortools>=9.10",
  "pandas>=2.2",
  "pandera>=0.20",
  "psycopg[binary]>=3.2",
  "pyarrow>=17",
  "pydantic>=2.8",
  "pyyaml>=6",
  "rasterio>=1.4",
  "scikit-learn>=1.5",
  "shapely>=2.0",
  "sqlalchemy>=2.1.8",
  "tenacity>=9",
]

[dependency-groups]
dev = [
    "hypothesis>=6.170.14",
    "mypy>=1.11",
    "pytest>=8",
    "ruff>=0.6",
    "types-pyyaml>=6.0.12.20261103",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-m 'not live and not acquired and not db' --strict-markers"
markers = [
  "live: reaches real public endpoints; run with `pytest -m live -o addopts=''`",
  "db: needs PostgreSQL with PostGIS at FIELDTWIN_DB_URL",
  "acquired: needs data from `make acquire`; run with `pytest -m acquired -o addopts=''`",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"pipelines/normalize/*.py" = ["E501"]
"pipelines/reconcile/*.py" = ["E501"]
"pipelines/synthetic/*.py" = ["E501"]
"packages/reconciliation/*.py" = ["E501"]
"packages/domain/reconciliation.py" = ["E501"]
"packages/scenario_engine/field_*.py" = ["E501"]
"packages/scenario_engine/network_*.py" = ["E501"]
"packages/scenario_engine/propagation.py" = ["E501"]
"packages/scenario_engine/benchmark_runs.py" = ["E501"]
"packages/scenario_engine/execution.py" = ["E501"]
"packages/anomaly_detection/*.py" = ["E501"]
"pipelines/experiments/*.py" = ["E501"]
"pipelines/inspection/*.py" = ["E501"]
"packages/inspection/*.py" = ["E501"]
"tests/integration/test_inspection_real.py" = ["E501"]
"tests/unit/test_anomaly_*.py" = ["E501"]
"tests/unit/test_benchmark_*.py" = ["E501"]
"tests/unit/test_execution.py" = ["E501"]
"tests/integration/test_experiments_real.py" = ["E501"]
"packages/scenario_engine/reference_solver.py" = ["E501"]
"tests/unit/test_field_*.py" = ["E501"]
"tests/unit/test_network_*.py" = ["E501"]
"tests/integration/test_field_db.py" = ["E501"]
"tests/unit/test_physics.py" = ["E501"]
"tests/unit/test_public_repo.py" = ["E501"]
"tests/unit/test_scaffold.py" = ["E501"]
"tests/unit/test_reconciliation.py" = ["E501"]
"tests/integration/test_reconciliation_db.py" = ["E501"]
"packages/domain/models.py" = ["E501"]
"scripts/*.py" = ["E501"]
"tests/integration/test_database.py" = ["E501"]
"tests/integration/test_canonical_real.py" = ["E501"]
"tests/provenance/*.py" = ["E501"]
"tests/unit/test_semantics_and_normalize.py" = ["E501"]
"pipelines/profile/*.py" = ["E501"]
"pipelines/acquire/nm_ocd/adapter.py" = ["E501"]
"tests/integration/test_acquisition.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
files = ["packages", "pipelines"]
explicit_package_bases = true
namespace_packages = true
mypy_path = "."
ignore_missing_imports = true
check_untyped_defs = true
