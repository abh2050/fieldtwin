# Local operational database. Not used until Gate 2.
services:
  postgres:
    # Published for amd64 in practice, so Apple Silicon runs it under emulation.
    image: postgis/postgis:16-3.4
    platform: linux/amd64
    environment:
      POSTGRES_DB: fieldtwin
      POSTGRES_USER: fieldtwin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-local-only}
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fieldtwin -d fieldtwin"]
      interval: 5s
      timeout: 3s
      retries: 20
volumes:
  pgdata:
